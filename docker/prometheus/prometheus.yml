global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "rate_limiters"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "fixed-window:8000"
          - "sliding-log:8000"
          - "sliding-counter:8000"
          - "token-bucket:8000"
          - "gcra:8000"
          - "concurrency:8000"
          - "multi-rule:8000"
          - "identity:8000"
          - "weighted-cost:8000"
          - "failure-modes:8000"
          - "shadow-mode:8000"
