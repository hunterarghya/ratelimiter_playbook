# Redis configuration for ratelimit-playbook demos

bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Logging & Monitoring
loglevel notice
slowlog-log-slower-than 10000
slowlog-max-len 128

# Memory management
maxmemory 256mb
maxmemory-policy noeviction

# Persistence disabled for demos (ephemeral, fast)
save ""
appendonly no
